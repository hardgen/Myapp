name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Cordova and Build APK
        run: |
          npm install -g cordova
          cordova create myapp com.example.app MyApp
          rm -rf myapp/www/*
          cp -r index.html myapp/www/
          if [ -d "css" ]; then cp -r css myapp/www/; fi
          if [ -d "js" ]; then cp -r js myapp/www/; fi
          if [ -d "assets" ]; then cp -r assets myapp/www/; fi
          cd myapp
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-app
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
