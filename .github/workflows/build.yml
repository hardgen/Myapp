name: Build HTML to APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Run HTML to APK Action
        uses: kimhuilim/web-to-app-action@main
        with:
          build-folder-path: './'
          app-name: 'MyApp'
          output-folder-path: 'apk'

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: apk/
          
